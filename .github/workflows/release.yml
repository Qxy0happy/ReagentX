name: build-release

on:
  push:
    tags:
      - "v*"

jobs:
  frontend:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44"

      - name: Install deps
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ReagentX-app-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReagentX-app-android
          path: frontend/build/app/outputs/flutter-apk/*.apk

  release:
    name: Create release
    needs: [frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Pack
        run: |
          mkdir dist
          cd ReagentX-app-android && cp *.apk ../dist/ && cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

name: build-release

on:
  push:
    tags:
      - "v*"

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o reagent-x-server .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: reagent-x-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/reagent-x-server${{ matrix.goos == 'windows' && '.exe' || '' }}

  frontend:
    name: Build frontend (Android APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29"

      - name: Install deps
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reagent-x-app-android
          path: frontend/build/app/outputs/flutter-apk/*.apk

  release:
    name: Create release
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Pack
        run: |
          mkdir dist
          cd reagent-x-server-linux-amd64 && tar czf ../dist/reagent-x-server-linux-amd64.tar.gz * && cd ..
          cd reagent-x-server-windows-amd64 && zip -r ../dist/reagent-x-server-windows-amd64.zip * && cd ..
          cd reagent-x-app-android && cp *.apk ../dist/ && cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
